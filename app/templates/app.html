<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="csrf" content="{{ csrf }}">
<title>Dockle</title>
<link rel="icon" href="/static/icons/dockle.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#111827">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="/static/css/editor.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Show or hide the stack list" title="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Dockle home">
      <svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="26" width="16" height="16" rx="3" fill="var(--accent)"/><rect x="26" y="26" width="16" height="16" rx="3" fill="var(--brand-navy)" class="logo-navy"/><rect x="16" y="6" width="16" height="16" rx="3" fill="var(--brand-navy)" class="logo-navy"/></svg>
      <span>Dockle</span>
    </a>
    <span class="spacer"></span>
    <button class="icon-btn hidden" id="topbarDockerRestartBtn" data-tip="Restart Docker" aria-label="Restart Docker">
      <svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn hidden" id="topbarRebootBtn" data-tip="Reboot server" aria-label="Reboot server">
      <svg viewBox="0 0 24 24"><path d="M12 3v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M7 5.5a8 8 0 1 0 10 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <form method="post" action="/logout" class="inline-form">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="icon-btn" type="submit" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24"><path d="M9 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3M14 8l4 4-4 4M18 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </form>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="btn-row">
      <a class="btn btn-icon-square" href="#/" data-tip="All stacks" aria-label="All stacks">
        <svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z M3 12l9 5 9-5 M3 16l9 5 9-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="btn btn-primary flex-1" href="#/new" id="newStackBtn">
        <svg viewBox="0 0 24 24" class="btn-ico"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        New stack
      </a>
    </div>
    <nav class="stack-nav" aria-label="Stacks">
      <h2 class="nav-title">Stacks</h2>
      <ul id="stackList" class="stack-list"></ul>
    </nav>
    <nav class="side-nav" aria-label="Sections">
      <a href="#/maintenance" data-nav="maintenance">
        <svg viewBox="0 0 24 24" class="nav-ico"><path d="M4 17l6-6M14 4l-2.5 2.5a4 4 0 0 0 5.5 5.5L19.5 9.5A4 4 0 0 1 14 4zM4 17l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Maintenance</a>
      <a href="#/activity" data-nav="activity">
        <svg viewBox="0 0 24 24" class="nav-ico"><path d="M4 12h4l2-7 4 14 2-7h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Activity</a>
      <a href="#/backups" data-nav="backups">
        <svg viewBox="0 0 24 24" class="nav-ico"><path d="M12 3v10m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Backups</a>
      <a href="#/settings" data-nav="settings">
        <svg viewBox="0 0 24 24" class="nav-ico"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3 1 2-3.5-2-1.5c.06-.4.1-.8.1-1.2z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
        Settings</a>
    </nav>
    <div class="versions" id="versions" role="status" aria-label="Versions"></div>
  </aside>

  <main class="content" id="content" tabindex="-1"></main>
</div>
<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/codemirror/codemirror.js"></script>
<script src="/static/vendor/codemirror/yaml.js"></script>
<script src="/static/vendor/codemirror/matchbrackets.js"></script>
<script src="/static/vendor/codemirror/active-line.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
