name: Publish Docker image

# Every push to main builds ghcr.io/lightmorphic/dockle and tags it both
# :latest and :<version> (read from app/config.py, the single source of
# truth for Dockle's version). Installs then just `docker compose pull` -
# nobody builds from source unless they choose to.
on:
  push:
    branches: [main]
    paths-ignore:
      - "sites/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Weekly rebuild with no code change: the Dockerfile's `apk upgrade`
  # only patches OS packages when an image actually gets built, so
  # without this, a quiet month would ship a steadily staler image.
  # :latest and the current version tag both get refreshed.
  schedule:
    - cron: "20 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from app/config.py
        id: version
        run: |
          v=$(grep -oP 'VERSION = "\K[0-9][0-9.]*' app/config.py)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # arm64 too: home servers are as likely to be a Raspberry Pi or an
      # ARM mini-PC as an x86 box.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lightmorphic/dockle:latest
            ghcr.io/lightmorphic/dockle:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted Docker Compose stack manager for home labs
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
