services:
  dockle:
    build: .
    image: dockle:latest
    container_name: dockle
    restart: unless-stopped
    ports:
      # localhost only - Tailscale Serve is the only intended way in.
      # Publishing 5001 without a host IP would also expose it on the LAN.
      - "127.0.0.1:5001:5001"
    environment:
      # The one and only secret. Set it once in .env or the shell:
      #   SECRET_KEY=$(python3 -c "import secrets;print(secrets.token_urlsafe(48))")
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before starting Dockle}
      TZ: ${TZ:-Europe/London}
      # Dockle asks the Docker socket to spin up short-lived helper
      # containers for backups (tar a volume, tar a bind-mount path).
      # The daemon resolves bind-mount sources against the HOST
      # filesystem, not Dockle's own container - so Dockle needs to
      # know its own data folder's real host path, not just where it
      # sees it internally (/app/data). Set this if you move compose.yaml
      # somewhere other than /opt/dockle.
      DOCKLE_DATA_HOST_PATH: ${DOCKLE_DATA_HOST_PATH:-/opt/dockle/data}
    volumes:
      - ./data:/app/data
      # Docker host: keep this line. Podman host: swap it for
      #   - /run/podman/podman.sock:/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks
      # Optional: only if you've installed the dockle-companion (host OS
      # update checks + Tailscale Serve management, see companion/ and
      # the runbook - Settings has a one-click installer for the host
      # side of this; uncomment this line and restart Dockle afterward
      # to finish connecting it).
      # - /run/dockle-companion.sock:/run/dockle-companion.sock
